name: Build and Publish Images

on:
  schedule:
    # Rebuild every Monday at 06:23 UTC, including updated base OS packages.
    - cron: '23 6 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream version to publish (e.g. v1.64.1); blank selects latest stable'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.tags.outputs.matrix }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Discover upstream stable image tags
        id: tags
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: uv run --locked --no-default-groups python scripts/upstream-tags.py --version "$REQUESTED_VERSION"
      - name: Determine GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.discover.outputs.matrix).tag }}
        architecture:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.architecture.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native image and upload untagged digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.architecture.arch }}
          build-args: PLAYWRIGHT_VERSION=${{ matrix.tag }}
          outputs: type=image,name=${{ needs.discover.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.tag }}
      - name: Test the exact uploaded image on its native architecture
        env:
          TEST_IMAGE: ${{ needs.discover.outputs.image }}@${{ steps.build.outputs.digest }}
        run: just test
      - name: Save tested digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.architecture.arch }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/$ARCH"
      - name: Upload tested digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.tag }}-${{ matrix.architecture.arch }}
          path: digests/
          if-no-files-found: error
          retention-days: 2
      - name: Upload browser screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ matrix.tag }}-${{ matrix.architecture.arch }}-${{ github.run_attempt }}
          path: test-results/end-to-end/
          if-no-files-found: warn
          retention-days: 14

  publish:
    # No public version tag is updated unless every native build/test passed.
    needs: [discover, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.tag }}-*
          path: digests
          merge-multiple: true
      - name: Publish upstream-compatible multi-architecture tags
        env:
          IMAGE: ${{ needs.discover.outputs.image }}
          TAG: ${{ matrix.tag }}
        run: |
          amd64=$(cat digests/amd64)
          arm64=$(cat digests/arm64)
          docker buildx imagetools create --tag "$IMAGE:$TAG" "$IMAGE@$amd64" "$IMAGE@$arm64"
          docker buildx imagetools create --tag "$IMAGE:$TAG-amd64" "$IMAGE@$amd64"
          docker buildx imagetools create --tag "$IMAGE:$TAG-arm64" "$IMAGE@$arm64"
          docker buildx imagetools inspect "$IMAGE:$TAG"
          echo "### Published $IMAGE:$TAG (linux/amd64 + linux/arm64)" >> "$GITHUB_STEP_SUMMARY"
