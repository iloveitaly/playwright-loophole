[project]
name = "playwright-loophole-tooling"
version = "0.0.0"
description = "Python test and maintenance tooling for the playwright-loophole Docker image"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
default-groups = ["dev", "test"]

[dependency-groups]
dev = ["ruff>=0.15"]
test = [
    "cryptography>=46",
    "playwright>=1.50,<2",
    "pytest>=8.3,<10",
    "python-hosts==1.1.3",
]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
